[dependency-groups]
macos = ["py2app>=0.28.10,<0.29", "pyobjc-framework-Cocoa>=12,<13"]

[tool.melty.app]
name = "Melty Code Editor"
bundle_id = "org.meltygui.code-editor"
version = "0.1.0"
entry = "editor.py"
dependencies = ["meltygui", "meltygui-pro"]
resources = ["project_templates"]
icon = "icon/melty-code-editor.png"

[tool.melty.tasks]
test = "python -m pytest tests -q"
smoke = "MELTY_BENCH=1 python editor.py editor.py"

[tool.melty.tasks."Run editor.py"]
cmd = "python -m editor"
cwd = "."
module = "editor.py"

[tool.melty.tasks."Run editor.py".env]
[tool.melty.tasks."Run app_model.py"]
cmd = "python -m app_model"
cwd = "."
module = "app_model.py"

[tool.melty.tasks."Run app_model.py".env]
[tool.melty.tasks."Run file_editor.py"]
cmd = "python -m file_editor"
cwd = "."
module = "file_editor.py"

[tool.melty.tasks."Run file_editor.py".env]
